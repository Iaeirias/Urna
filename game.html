<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Urna</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0d0f0c;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:720px;height:1280px;transform-origin:center;background:#cfcfc6;padding:28px 30px;display:flex;flex-direction:column;gap:18px}
h1{text-align:center;font-size:50px;letter-spacing:1px;color:#23251f}
#legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:8px;background:#e9eae1;border:3px solid #23251f;border-radius:10px;padding:6px 14px;font-weight:700;font-size:24px;color:#23251f}
.lg img{width:34px;height:34px}
.lg b{padding:2px 10px;color:#fff;border-radius:6px}
#screen{background:#eef0e6;border:8px solid #23251f;border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px;position:relative;box-shadow:inset 0 0 30px rgba(0,0,0,.18)}
.c{display:flex;flex-direction:column;align-items:center;gap:10px;border:6px solid var(--k);border-radius:12px;padding:14px 8px;background:#fff;transition:transform .2s}
.c.pop{transform:scale(1.04)}
.c img{width:230px;height:260px;object-fit:cover;border-radius:8px;background:#ccc}
.num{display:flex;gap:8px}
.num i{font-style:normal;width:62px;height:76px;border:4px solid #23251f;border-radius:6px;font-size:64px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#23251f}
.nm{font-size:34px;font-weight:800;color:#23251f}.pt{font-size:22px;color:#555;margin-top:-6px}
.v{font-size:76px;font-weight:900;color:var(--k);line-height:1}.p{font-size:28px;font-weight:700;color:#23251f}
#bar{height:46px;border:5px solid #23251f;border-radius:10px;overflow:hidden;display:flex;background:#fff}
#bar div{height:100%;transition:width .5s;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:380px;margin:0 auto}
.k{height:62px;background:#2a2c27;color:#fff;border-radius:8px;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;border-bottom:6px solid #111;transition:all .08s}
.k.on{background:#ffd23c;color:#111;transform:translateY(4px);border-bottom-width:2px}
.k.w{background:#f4f4f4;color:#222;font-size:17px}.k.r{background:#e2661f;font-size:17px}.k.g{background:#1e9a45;font-size:17px}
.k.w.on,.k.r.on,.k.g.on{background:#ffd23c;color:#111}
#ovl{position:absolute;inset:0;background:rgba(238,240,230,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:6px;text-align:center}
#ovl.show{display:flex}#ovl .t{font-size:34px;font-weight:700;color:#23251f}#ovl .f{font-size:120px;font-weight:900;color:#23251f}#ovl .u{font-size:30px;color:#444}
#tick{display:flex;flex-direction:column;gap:6px;font-size:23px;color:#23251f;min-height:150px}
#tick div{background:#e9eae1;border-left:8px solid var(--k);padding:5px 12px;border-radius:6px}
#snd{position:absolute;inset:0;background:rgba(0,0,0,.8);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;text-align:center;z-index:9}
</style></head><body>
<div id="stage">
 <h1 id="title"></h1>
 <div id="legend"></div>
 <div id="screen"><div id="c0" class="c"></div><div id="c1" class="c"></div>
  <div id="ovl"><div class="t">VOTO CONFIRMADO</div><div class="f">FIM</div><div class="u"></div></div></div>
 <div id="bar"><div id="b0"></div><div id="b1"></div></div>
 <div id="pad"></div>
 <div id="tick"></div>
 <div id="snd">Toque para ativar o som</div>
</div>
<script>
const $=id=>document.getElementById(id);
let cfg=null,votes=[0,0],recent=[],queue=[],busy=false,ac=null;
function fit(){const s=Math.min(innerWidth/720,innerHeight/1280);$('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();
$('snd').onclick=()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();$('snd').remove()};
const keys=['1','2','3','4','5','6','7','8','9','BRANCO','0','CORRIGE'];
$('pad').innerHTML=keys.map(k=>`<div class="k ${k.length>1?(k=='BRANCO'?'w':'r'):''}" data-k="${k}">${k}</div>`).join('')+'<div class="k g" data-k="CONFIRMA" style="grid-column:1/4">CONFIRMA</div>';
function key(k,on){const e=document.querySelector(`[data-k="${k}"]`);if(e)e.classList.toggle('on',on)}
function beep(f,d,t=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}
const pct=i=>{const s=votes[0]+votes[1];return s?Math.round(votes[i]*100/s):50};
function render(){
 if(!cfg)return;
 $('title').textContent=cfg.title;
 cfg.candidates.forEach((c,i)=>{
  const e=$('c'+i);e.style.setProperty('--k',c.color);
  e.innerHTML=`<img src="${c.image}" alt=""><div class="num">${[...c.number].map(d=>`<i>${d}</i>`).join('')}</div><div class="nm">${c.name}</div><div class="pt">${c.party}</div><div class="v">${votes[i].toLocaleString('pt-BR')}</div><div class="p">${pct(i)}%</div>`;
  const b=$('b'+i);b.style.width=pct(i)+'%';b.style.background=c.color;b.textContent=pct(i)>12?pct(i)+'%':'';
 });
 $('legend').innerHTML=cfg.gifts.map(g=>{const c=cfg.candidates[g.candidate];return `<div class="lg"><img src="${g.image}" style="filter:${g.css||'none'}" alt=""> ${g.label} <b style="background:${c.color}">${c.number}</b></div>`}).join('');
 $('tick').innerHTML=recent.map(r=>`<div style="--k:${cfg.candidates[r.candidate].color}">@${r.user} votou ${cfg.candidates[r.candidate].number} (${r.count}x ${r.gift})</div>`).join('');
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function play(v){
 const c=cfg.candidates[v.candidate],digits=[...c.number];
 for(const d of digits){key(d,true);beep(900,.08);await wait(140);key(d,false)}
 key('CONFIRMA',true);await wait(120);key('CONFIRMA',false);
 beep(700,.9);$('ovl').querySelector('.u').textContent='@'+v.user+' votou '+c.number+' ('+c.name+')';
 $('ovl').classList.add('show');$('c'+v.candidate).classList.add('pop');
 await wait(900);$('ovl').classList.remove('show');$('c'+v.candidate).classList.remove('pop');
}
async function run(){if(busy)return;busy=true;while(queue.length){await play(queue.shift())}busy=false}
function connect(){
 const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
 ws.onmessage=m=>{const d=JSON.parse(m.data);
  if(d.type=='STATE'){cfg=d.config;votes=d.votes;recent=d.recent;render()}
  if(d.type=='VOTE'){votes=d.votes;recent=d.recent;render();if(queue.length<4){queue.push(d);run()}else beep(700,.2)}};
 ws.onclose=()=>setTimeout(connect,2000);
}
connect();
</script></body></html>
