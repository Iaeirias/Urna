<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Urna">
<meta name="theme-color" content="#0a0f1e">
<link rel="manifest" href="/manifest.webmanifest">
<title>Urna</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#05070f;overflow:hidden;font-family:"Arial Black",Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:720px;height:1280px;transform-origin:center;padding:26px 24px;display:flex;flex-direction:column;gap:12px;color:#fff;
 background:radial-gradient(900px 500px at 50% -80px,#1d3b8a 0%,rgba(29,59,138,0) 70%),radial-gradient(700px 500px at 50% 1300px,#0e5a34 0%,rgba(14,90,52,0) 70%),#0a0f1e}
#top{text-align:center;height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#title{font-size:62px;line-height:1;letter-spacing:1px;font-style:italic;text-transform:uppercase;color:#ffd23c;background:linear-gradient(180deg,#fff6b0 0%,#ffd23c 45%,#f29d00 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.55))}
#live{font:700 20px Arial,sans-serif;letter-spacing:3px;background:#d4122c;border-radius:20px;padding:4px 16px;display:flex;align-items:center;gap:8px}
#live i{width:12px;height:12px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
#legend{display:flex;justify-content:center;gap:16px;height:66px}
.lg{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:4px 18px;font:900 32px Arial,sans-serif;letter-spacing:1px}
.lg img{width:52px;height:52px;object-fit:contain}.lg b{padding:0 12px;border-radius:8px;font-size:32px;line-height:44px}
#info{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:12px;height:84px}
.ib{background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ib small{font:700 17px Arial,sans-serif;letter-spacing:2px;color:#9fb0d8}.ib span{font-size:38px;line-height:1.1}
#lead{font-size:30px;text-align:center;line-height:1.1;padding:0 8px}
#cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;height:420px}
.c{position:relative;background:linear-gradient(180deg,#18213d,#0d1326);border:4px solid var(--k);border-radius:18px;padding:12px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 0 26px -4px var(--k);transition:transform .2s}
.c.pop{transform:scale(1.045)}
.chead{width:100%;display:flex;align-items:center;justify-content:space-between;height:44px}
.cnum{background:var(--k);border-radius:10px;padding:0 14px;font-size:40px;line-height:46px}
.tag{background:#ffd23c;color:#14161f;border-radius:8px;padding:3px 10px;font:900 17px Arial,sans-serif;letter-spacing:1px;visibility:hidden}
.c.lead .tag{visibility:visible}
.photo{width:78px;height:78px;border-radius:50%;object-fit:cover;object-position:top;border:4px solid var(--k);background:#555}
.cname{font-size:28px;margin-top:2px}.cname small{font:700 18px Arial,sans-serif;color:#9fb0d8;margin-left:4px}
.pts{font-size:94px;line-height:1;margin-top:2px;text-shadow:0 4px 0 rgba(0,0,0,.5)}
.pl{font:700 17px Arial,sans-serif;letter-spacing:3px;color:#9fb0d8;margin-top:-4px}
.delta{position:absolute;right:16px;top:130px;font-size:44px;color:#5dff8f;opacity:0;text-shadow:0 3px 0 #000}
.delta.go{animation:up 1.1s ease-out}
@keyframes up{0%{opacity:1;transform:translateY(14px) scale(1.3)}100%{opacity:0;transform:translateY(-40px)}}
.pbar{width:100%;height:14px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--k);transition:width .5s}
.pct{font-size:30px;margin-top:2px}
.last{width:100%;text-align:center;font:700 19px Arial,sans-serif;color:#c9d4f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#urnas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;height:350px}
.uw{position:relative}
.urna{position:relative;height:262px;background:linear-gradient(180deg,#dcdcd2,#bdbdb2);border:4px solid #1b1d18;border-radius:14px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;box-shadow:0 10px 0 #6b6b60,0 18px 26px rgba(0,0,0,.6)}
.scr{position:relative;background:#e9ecdc;border:3px solid #222;border-radius:6px;padding:8px 6px;color:#222;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden}
.scr .l1{font-size:11px;font-weight:700;letter-spacing:.5px}.scr .l2{font-size:13px;font-weight:700}
.boxes{display:flex;gap:5px;margin-top:4px}
.boxes i{font-style:normal;width:34px;height:44px;border:3px solid #222;border-radius:4px;display:flex;align-items:center;justify-content:center;font:900 32px Arial,sans-serif;color:#222;background:#fff}
.boxes i.ghost{color:rgba(0,0,0,.14)}
.scr .nm{font-size:13px;font-weight:700;text-align:center;line-height:1.1}
.fim{position:absolute;inset:0;background:#e9ecdc;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.fim.show{display:flex}.fim b{font:900 62px Arial,sans-serif;color:#222;line-height:1}.fim span{font:700 12px Arial,sans-serif;color:#222}.fim em{font:900 17px Arial,sans-serif;color:#0a7d2c;font-style:normal;margin-top:4px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:start}
.k{height:34px;background:#2a2c27;color:#fff;border-radius:5px;font:700 17px Arial,sans-serif;display:flex;align-items:center;justify-content:center;border-bottom:4px solid #111;transition:all .07s}
.k.on{background:#ffd23c;color:#111;transform:translateY(3px);border-bottom-width:1px}
.k.w{background:#f4f4f4;color:#222;font-size:9px}.k.r{background:#e2661f;font-size:9px}.k.g{background:#1e9a45;font-size:11px;grid-column:1/4;height:38px}
.k.w.on,.k.r.on,.k.g.on{background:#ffd23c;color:#111}
.led{position:absolute;right:14px;bottom:10px;width:16px;height:16px;border-radius:50%;background:#2e4a35;border:2px solid #111}
.led.on{background:#3dff72;box-shadow:0 0 14px #3dff72}
.hand{position:absolute;left:60%;top:96%;opacity:0;font-size:76px;line-height:1;transform:translate(-45%,-8%);transition:left .12s,top .12s;filter:drop-shadow(0 6px 4px rgba(0,0,0,.55));pointer-events:none;z-index:3}
.hand.vis{opacity:1}
.hand.tap{transform:translate(-45%,-2%) scale(.92)}
#tick{display:flex;flex-direction:column;gap:5px;font:700 21px Arial,sans-serif;min-height:150px}
#tick div{background:rgba(255,255,255,.1);border-left:8px solid var(--k);padding:4px 12px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#snd{position:absolute;inset:0;background:rgba(0,0,0,.82);color:#fff;font:700 40px Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;z-index:9}
</style></head><body>
<div id="stage">
 <div id="top"><div id="title"></div><div id="live"><i></i>AO VIVO</div></div>
 <div id="legend"></div>
 <div id="info">
  <div class="ib"><small>TOTAL</small><span id="tot">0</span></div>
  <div class="ib"><div id="lead">—</div></div>
  <div class="ib"><small>DIFERENÇA</small><span id="dif">0</span></div>
 </div>
 <div id="cards"><div id="c0" class="c"></div><div id="c1" class="c"></div></div>
 <div id="urnas"><div id="uw0" class="uw"></div><div id="uw1" class="uw"></div></div>
 <div id="tick"></div>
 <div id="snd">Toque para ativar o som</div>
</div>
<script>
const $=id=>document.getElementById(id);
let cfg=null,votes=[0,0],shown=[0,0],recent=[],shownRecent=[],queue=[],busy=false,ac=null;
function fit(){const s=Math.min(innerWidth/720,innerHeight/1280);$('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();
$('snd').onclick=()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();$('snd').remove()};
const KEYS=['1','2','3','4','5','6','7','8','9','BRANCO','0','CORRIGE'];
let bus=null;
function getBus(){if(!ac)return null;if(!bus){bus=ac.createDynamicsCompressor();const g=ac.createGain();g.gain.value=.9;bus.connect(g);g.connect(ac.destination)}return bus}
function tone(f,d,o={}){const b=getBus();if(!b)return;const type=o.type||'sine',vol=o.vol||.1,t=o.t||0,osc=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;osc.type=type;osc.frequency.setValueAtTime(f,s);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.006);g.gain.exponentialRampToValueAtTime(.0001,s+d);osc.connect(g);g.connect(b);osc.start(s);osc.stop(s+d+.03)}
function click(){const b=getBus();if(!b)return;const n=Math.floor(ac.sampleRate*.03),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='highpass';f.frequency.value=1800;g.gain.value=.5;src.buffer=buf;src.connect(f);f.connect(g);g.connect(b);src.start()}
function keySound(){click();tone(1500,.05,{type:'square',vol:.04,to:1100})}
const CHORDS=[[523.25,659.25,783.99,1046.5],[587.33,739.99,880,1174.66]];
function confirmSound(i,count){
 tone(1000,.9,{type:'square',vol:.07});
 const ch=CHORDS[i%2];ch.forEach((f,n)=>tone(f,.45,{type:'triangle',vol:.1,t:.12+n*.09}));
 if(count>=3)[1,1.25,1.5,2].forEach((m,n)=>tone(ch[3]*m,.3,{type:'sine',vol:.06,t:.55+n*.07}));
 if(count>=10)tone(ch[0]/2,1.1,{type:'sawtooth',vol:.05,t:.1,to:ch[0]});
}
function fanfare(){[392,523.25,659.25,783.99,1046.5].forEach((f,n)=>{tone(f,.28,{type:'square',vol:.06,t:n*.1});tone(f*2,.28,{type:'triangle',vol:.05,t:n*.1})});tone(1046.5,.7,{type:'triangle',vol:.1,t:.55})}
const leadOf=a=>a[0]>a[1]?0:a[1]>a[0]?1:-1;
const sum=()=>shown[0]+shown[1];
const pctN=i=>{const s=sum();return s?shown[i]*100/s:50};
const pctT=i=>pctN(i).toFixed(1).replace('.',',')+'%';
const fmt=n=>Number(n).toLocaleString('pt-BR');
let built=false;
function buildUrnas(){
 cfg.candidates.forEach((c,i)=>{
  $('uw'+i).innerHTML=`<div class="urna" id="u${i}">
   <div class="scr"><div class="l1">SEU VOTO PARA</div><div class="l2">Número:</div>
    <div class="boxes" id="bx${i}"></div><div class="nm">${c.name}<br>${c.party}</div>
    <div class="fim" id="fim${i}"><b>FIM</b><span>CONFIRMADO</span><em id="fimt${i}">+1 PONTO</em></div></div>
   <div class="pad">${KEYS.map(k=>`<div class="k ${k.length>1?(k=='BRANCO'?'w':'r'):''}" data-k="${k}">${k}</div>`).join('')}<div class="k g" data-k="CONFIRMA">CONFIRMA</div></div>
   <div class="led" id="led${i}"></div><div class="hand" id="hand${i}">👆</div></div>`;
  setBoxes(i,0);
 });
 built=true;
}
function setBoxes(i,filled){
 const d=[...cfg.candidates[i].number];
 $('bx'+i).innerHTML=d.map((x,n)=>`<i class="${n<filled?'':'ghost'}">${x}</i>`).join('');
}
function render(){
 if(!cfg)return;
 if(!built)buildUrnas();
 $('title').textContent=cfg.title;
 const lead=shown[0]>shown[1]?0:shown[1]>shown[0]?1:-1;
 $('tot').textContent=fmt(sum());$('dif').textContent=fmt(Math.abs(shown[0]-shown[1]));
 $('lead').innerHTML=lead<0?'EMPATE':`<span style="color:${cfg.candidates[lead].color}">${cfg.candidates[lead].number}</span> NA FRENTE`;
 cfg.candidates.forEach((c,i)=>{
  const e=$('c'+i);e.style.setProperty('--k',c.color);e.classList.toggle('lead',lead===i);
  const lastV=shownRecent.find(r=>r.candidate===i);
  e.innerHTML=`<div class="chead"><span class="cnum">${c.number}</span><span class="tag">NA FRENTE</span></div>
   <img class="photo" src="${c.image}" alt=""><div class="cname">${c.name}<small>${c.party}</small></div>
   <div class="pts">${fmt(shown[i])}</div><div class="pl">PONTOS</div><div class="delta" id="dl${i}"></div>
   <div class="pbar"><i style="width:${pctN(i)}%"></i></div><div class="pct">${pctT(i)}</div>
   <div class="last">${lastV?'@'+lastV.user+' • '+lastV.gift+' • +'+lastV.count+(lastV.count>1?' pontos':' ponto'):'aguardando votos'}</div>`;
 });
 $('legend').innerHTML=cfg.gifts.map(g=>{const c=cfg.candidates[g.candidate];return `<div class="lg"><img src="${g.image}" style="filter:${g.css||'none'}" alt=""> <span>VOTE</span> <b style="background:${c.color}">${c.number}</b></div>`}).join('');
 $('tick').innerHTML=shownRecent.slice(0,5).map(r=>`<div style="--k:${cfg.candidates[r.candidate].color}">@${r.user} votou ${cfg.candidates[r.candidate].number} (${r.count}x ${r.gift})</div>`).join('');
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function moveHand(i,k){
 const u=$('u'+i),h=$('hand'+i);
 if(!k){h.classList.remove('vis');h.style.left='60%';h.style.top='96%';return}
 h.classList.add('vis');
 const e=u.querySelector(`[data-k="${k}"]`);if(!e)return;
 h.style.left=(e.offsetLeft+e.offsetWidth/2)+'px';h.style.top=(e.offsetTop+e.offsetHeight/2)+'px';
}
async function press(i,k){
 const u=$('u'+i),e=u.querySelector(`[data-k="${k}"]`),h=$('hand'+i);
 moveHand(i,k);await wait(130);
 if(e)e.classList.add('on');h.classList.add('tap');keySound();
 await wait(150);
 if(e)e.classList.remove('on');h.classList.remove('tap');
}
async function play(v){
 const i=v.candidate,c=cfg.candidates[i],digits=[...c.number];
 setBoxes(i,0);$('fim'+i).classList.remove('show');$('led'+i).classList.remove('on');
 for(let n=0;n<digits.length;n++){await press(i,digits[n]);setBoxes(i,n+1)}
 await press(i,'CONFIRMA');
 $('fimt'+i).textContent='+'+v.count+(v.count>1?' PONTOS':' PONTO');
 $('fim'+i).classList.add('show');$('led'+i).classList.add('on');confirmSound(i,v.count);
 const before=leadOf(shown);shown=v.votes.slice();shownRecent=v.recent;render();
 const after=leadOf(shown);if(before>=0&&after>=0&&before!==after)setTimeout(fanfare,750);
 const d=$('dl'+i);if(d){d.textContent='+'+v.count;d.classList.remove('go');void d.offsetWidth;d.classList.add('go')}
 $('c'+i).classList.add('pop');
 await wait(1000);
 $('c'+i).classList.remove('pop');$('fim'+i).classList.remove('show');$('led'+i).classList.remove('on');
 setBoxes(i,0);moveHand(i,null);
}
async function run(){if(busy)return;busy=true;while(queue.length){await play(queue.shift())}shown=votes.slice();shownRecent=recent;render();busy=false}
function connect(){
 const ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
 ws.onmessage=m=>{const d=JSON.parse(m.data);
  if(d.type=='STATE'){cfg=d.config;votes=d.votes;recent=d.recent;if(!busy){shown=votes.slice();shownRecent=recent}render()}
  if(d.type=='VOTE'){votes=d.votes;recent=d.recent;if(queue.length<4){queue.push(d);run()}else{tone(600,.15,{type:'square',vol:.05});if(!busy){shown=votes.slice();shownRecent=recent;render()}}}};
 ws.onclose=()=>setTimeout(connect,2000);
}
connect();
</script></body></html>
